aid: makeup-by-mario
name: Makeup by Mario
description: >-
  MAKEUP BY MARIO is a New York-based prestige colour-cosmetics brand founded by celebrity
  makeup artist Mario Dedivanovic and launched direct-to-consumer in October 2020, selling
  face, eye, lip, brow, blush and tool products at makeupbymario.com and through Sephora.
  Self-funded for its first two and a half years, it took a $40M minority growth investment
  from Provenance and Silas Capital in January 2023. It runs no developer program and
  publishes no OpenAPI, but its Shopify-hosted storefront exposes a substantial
  machine-readable surface from its own domain: an anonymously introspectable Storefront
  GraphQL API, TWO live Model Context Protocol servers whose tools/list both answer
  anonymously, a Universal Commerce Protocol merchant profile at /.well-known/ucp declaring
  cart, checkout, fulfillment, discount, order and catalog capabilities plus three payment
  handlers, OpenID Connect and RFC 8414 discovery for customer accounts, and a
  provider-authored /agents.md and /llms.txt that tell AI agents which surface to use and
  that no agent may finalize payment without contemporaneous human approval.
