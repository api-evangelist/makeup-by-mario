apis:
- aid: makeup-by-mario:storefront-graphql
  name: MAKEUP BY MARIO Storefront GraphQL API
  description: >-
    The Shopify Storefront GraphQL API as served from MAKEUP BY MARIO's own domain.
    Introspection is anonymous — the full schema (416 types, 34 query fields, 41 mutations,
    28 Relay connections, 49 deprecated fields) was retrieved without an
    X-Shopify-Storefront-Access-Token on 2026-08-25. Covers the product catalog,
    collections, cart and checkout preparation, editorial content, store policies and
    customer accounts. Four API versions answered anonymously (2025-10, 2026-01, 2026-04,
    2026-07 are supported; 2026-10 and unstable are published but unsupported).
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://www.makeupbymario.com/api/2026-04/graphql.json
  tags:
  - GraphQL
  - E-Commerce
  - Catalog
  - Cart
  tags_raw:
  - GraphQL
  - Ecommerce
  - Catalog
  - Cart
  properties:
  - type: GraphQL
    url: graphql/makeup-by-mario-storefront.graphql
  - type: GraphQLManifest
    url: graphql/makeup-by-mario-graphql.yml
  - type: DataModel
    url: data-model/makeup-by-mario-data-model.yml
- aid: makeup-by-mario:storefront-mcp
  name: MAKEUP BY MARIO Storefront MCP Server
  description: >-
    A live Model Context Protocol server on the MAKEUP BY MARIO storefront host. An
    anonymous JSON-RPC tools/list returned five tools with full JSON Schema input contracts
    — search_catalog, get_product_details, get_cart, update_cart and
    search_shop_policies_and_faqs. initialize reports serverInfo storefront-renderer 0.1.0
    on MCP protocol 2025-06-18; resources/list and prompts/list both answer 200 with empty
    arrays.
  humanURL: https://www.makeupbymario.com/agents.md
  baseURL: https://www.makeupbymario.com/api/mcp
  tags:
  - MCP
  - Agents
  - E-Commerce
  tags_raw:
  - MCP
  - Agents
  - Ecommerce
  properties:
  - type: MCPServer
    url: mcp/makeup-by-mario-mcp.yml
  - type: ToolCrosswalk
    url: mcp/makeup-by-mario-tool-crosswalk.yml
- aid: makeup-by-mario:ucp-commerce
  name: MAKEUP BY MARIO UCP Agentic Commerce API
  description: >-
    MAKEUP BY MARIO implements the Universal Commerce Protocol for agent-driven commerce.
    The merchant profile at /.well-known/ucp declares UCP 2026-04-08 and 2026-01-23, the
    dev.ucp.shopping MCP service endpoint, the cart / checkout / fulfillment / discount /
    order / catalog-search / catalog-lookup capabilities and three payment handlers (Google
    Pay, Shopify card and Shop Pay). This endpoint's tools/list answers ANONYMOUSLY —
    thirteen tools with full JSON Schema input contracts spanning the whole
    cart-to-completed-order lifecycle. complete_checkout requires a meta.idempotency-key and
    still requires contemporaneous buyer approval for payment.
  humanURL: https://ucp.dev/2026-04-08/specification/overview/
  baseURL: https://www.makeupbymario.com/api/ucp/mcp
  tags:
  - UCP
  - Agentic Commerce
  - MCP
  - Checkout
