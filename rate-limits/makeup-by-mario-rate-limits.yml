gaps:
- No published numeric limit, window or burst for any surface.
- No RateLimit-* or X-RateLimit-* headers, and no Retry-After on the MCP endpoints.
- >-
  The MCP cost headers report what a request cost but never what budget remains, so an
  agent can only discover the ceiling by hitting it.
