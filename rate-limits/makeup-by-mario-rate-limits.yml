description: >-
  MAKEUP BY MARIO publishes no rate-limit numbers — there is no developer program and no
  docs page to state them. What it does publish is the INSTRUCTION, in its own /llms.txt:
  "Respect rate limits. The MCP endpoint is rate-limited per IP. Back off on 429 responses."
  The runtime signal, which is what an agent actually needs, is a cost score rather than a
  quota counter, and it was read off live responses.
limit_count: 0
note: >-
  limit_count is 0 because no numeric limit is published anywhere. This is not the same as
  "no rate limiting" — the limiting is real and cost-based, and the headers below are
  emitted on every response. An agent cannot compute headroom from them, because neither
  endpoint returns the budget remaining.
limits: []
