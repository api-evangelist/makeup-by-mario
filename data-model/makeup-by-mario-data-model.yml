- name: ProductOption
  key_fields: [id, name, optionValues]
  domain: catalog
  observed_axes: [Shade, Color, Size, Denominations, Variant, Title]
  note: >-
    Shade is the load-bearing axis for a colour-cosmetics catalog — it is what a shopper and
    an agent both have to get right, and it is why get_product_details takes an options
    parameter. Denominations appears only on gift cards.
- name: Collection
  key_fields: [id, handle, title, description, image, updatedAt]
  domain: catalog
  observed_handles: [shop-all, bestsellers, award-winning, eyes, lips, face-products, brow, brushes, gift-cards, marios-exclusives, glam-quads, gifts-under-50, marios-mini-kits]
  note: >-
    Merchandising collections mix product taxonomy (eyes, lips, brow) with editorial and
    campaign groupings (get-the-look, two-step-transformation). No MCP tool reaches any of
    them — see the crosswalk.
- name: Cart
