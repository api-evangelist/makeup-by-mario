description: >-
  Entity-relationship graph derived from the GraphQL SDL anonymously introspected off MAKEUP
  BY MARIO's own host, cross-checked against the live catalog at /products.json. Every
  entity and relationship below was read from a field declaration in the SDL or a value in
  the live catalog — nothing is inferred beyond the type system. The Checkout entity is the
  exception and is marked as such: it exists only in the UCP tool schemas.
id_scheme:
  format: 'gid://shopify/{Type}/{id}'
  encoding: opaque ID scalar, globally unique, resolvable via the node/nodes queries
  observed_in_tool_docs: ['gid://shopify/Checkout/abc123', 'gid://shopify/Product/...', 'gid://shopify/ProductVariant/...']
  legacy_numeric_ids: >-
    /products.json exposes bare integer ids (e.g. product 7978338189377) — the pre-GraphQL
    REST identifiers. They are the numeric tail of the corresponding gid.
  handles: >-
    Product, Collection, Page, Blog, Article and Metaobject also carry a human-readable
    handle used in storefront URLs and in the *ByHandle queries.
