generated: '2026-08-25'
method: probed
status: published
source: https://www.makeupbymario.com/api/ucp/mcp
description: >-
  MAKEUP BY MARIO serves TWO live MCP endpoints from its own storefront host, and BOTH
  answer an anonymous JSON-RPC tools/list with HTTP 200 and full JSON Schema input
  contracts. The Shopify Storefront MCP server at /api/mcp returned five read/cart tools.
  The Universal Commerce Protocol MCP server at /api/ucp/mcp returned thirteen tools
  covering the entire catalog -> cart -> checkout -> completed-order lifecycle, including
  complete_checkout. On the UCP server only resources/list and prompts/list are gated,
  behind a resolvable UCP agent profile URI; on the Storefront server both answer 200 with
  empty arrays. Neither endpoint was guessed — both are named in the provider's own
  /robots.txt and /llms.txt.
deployment:
  mode: remote
  endpoint: https://www.makeupbymario.com/api/ucp/mcp
  auth: none
  verified: probed
  note: >-
    Remote HTTP MCP, callable by an agent with no installation step. There is no stdio
    package: nothing in the provider's documents offers an npx or pip install. Tool
    INVOCATION additionally requires meta["ucp-agent"].profile, a resolvable agent profile
    URI that is a required property on all thirteen UCP tools, so an agent must publish a
    profile before it can call anything beyond discovery.
servers:
- name: makeup-by-mario-ucp-mcp
  transport: http
  url: https://www.makeupbymario.com/api/ucp/mcp
  canonical_url: https://makeupbymario.myshopify.com/api/ucp/mcp
  protocol: MCP (JSON-RPC 2.0) over the Universal Commerce Protocol
  protocol_version: '2025-06-18'
  server_info:
    name: universal-commerce
    version: 0.1.0
  spec: https://ucp.dev/2026-04-08/specification/overview/
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
  api_version_header: 'x-shopify-ucp-mcp-api-version: 2026-04-08'
  auth: >-
    None observed for tools/list and initialize — an anonymous POST returned 200 with all
    thirteen tools. resources/list and prompts/list return JSON-RPC error -32001 "UCP
    discovery failed" / invalid_profile_url ("Missing profile uri"), so those two methods
    require a resolvable UCP agent profile.
  capabilities:
    tools:
      listChanged: true
    prompts:
      listChanged: true
    resources:
      listChanged: true
    logging: {}
  tools_list:
    verified: '2026-08-25'
    http_status: 200
    gated: false
    tool_count: 13
    file: makeup-by-mario-ucp-mcp-tools.json
  vendor: Shopify UCP commerce server
