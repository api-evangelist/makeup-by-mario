  fact rather than by omission — the binding target here is the Storefront GraphQL API,
  which is served anonymously from the same host and is the only other machine-readable
  contract the store exposes. Rows bind each MCP tool to the GraphQL query/mutation
  field(s) that cover the same commerce operation. Both artifacts were retrieved live and
  anonymously, so tool names, GraphQL field names and input schemas are all verified; what
  is DERIVED is the binding between them, which is why confidence is stated per row.
